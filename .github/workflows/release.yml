name: Package and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (example: v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name || github.event.inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          TAG_INPUT='${{ github.event.inputs.tag || '' }}'
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag/version mismatch: tag=$TAG package.json=$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Validate language pack
        run: |
          node --test
          node tools/check.mjs --strict
          node tools/build.mjs --check
      - name: Build distributable archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.release.outputs.version }}'
          mkdir -p staging/dsh-locale-ja dist
          cp package.json index.js client.js cordis.patch.yml icon.svg README.md LICENSE install.mjs staging/dsh-locale-ja/
          cp -R dictionaries tools staging/dsh-locale-ja/
          cp client.src.js staging/dsh-locale-ja/
          cat > staging/dsh-locale-ja/INSTALL.txt <<'TXT'
          DSH 日本語ランゲージパック

          前提:
          - 設定済みの DSH Web プロファイル
          - Node.js と pnpm

          手順:
          1) DSH を停止する
          2) このアーカイブを固定パスに展開する
          3) 展開先で実行する: node install.mjs
             （必要なら明示: node install.mjs --profile /absolute/path/to/dsh/profiles/web）
          4) DSH を起動し直し、ブラウザーを再読み込みして日本語を選ぶ

          補足:
          - v1.0.0 の旧アーカイブには install.mjs は含まれません
          - link: 参照を使うため、展開したフォルダーを移動・削除しないでください
          TXT
          (cd staging && zip -qr "../dist/dsh-locale-ja-${VERSION}-windows.zip" dsh-locale-ja)
          tar -czf "dist/dsh-locale-ja-${VERSION}-linux.tar.gz" -C staging dsh-locale-ja
          (cd dist && sha256sum "dsh-locale-ja-${VERSION}-windows.zip" "dsh-locale-ja-${VERSION}-linux.tar.gz" > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.release.outputs.version }}'
          TAG='${{ steps.release.outputs.tag }}'
          cat > release-notes.md <<'EOF_NOTES'
          ## 日本語ランゲージパック

          - Windows / Linux アーカイブに `install.mjs` を同梱
          - 展開先で `node install.mjs` を実行して導入可能
          - `SHA256SUMS` を同梱
          - `v1.0.0` の旧アーカイブにはインストーラーはありません

          この配布物は言語パックです。DSH 実環境での統合動作は、利用者の環境で確認してください。
          EOF_NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" "dist/dsh-locale-ja-${VERSION}-windows.zip" "dist/dsh-locale-ja-${VERSION}-linux.tar.gz" dist/SHA256SUMS --target "$GITHUB_SHA" --title "$TAG — 日本語ランゲージパック" --notes-file release-notes.md
