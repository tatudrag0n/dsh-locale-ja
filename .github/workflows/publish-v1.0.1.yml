name: Initiate v1.0.1 release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.0.1.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: initiate-v1.0.1
  cancel-in-progress: false

jobs:
  initiate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create fixed version tag and dispatch release workflow
        shell: bash
        run: |
          set -euo pipefail
          TARGET='d23fc5061398d8afa857b916dec3f1c853d99fdd'
          TAG='v1.0.1'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'v1.0.1 already published; nothing to do.'
            exit 0
          fi
          if EXISTING=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null); then
            test "$EXISTING" = "$TARGET" || { echo 'Existing tag points to a different commit; refusing to modify it.' >&2; exit 1; }
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$TARGET"
          fi
          gh workflow run release.yml --repo "$GH_REPO" --ref main -f "tag=$TAG"
